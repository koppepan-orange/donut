<!DOCTYPE html>
<html lang="js">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mitame.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://cdn.rawgit.com/daishihmr/vox.js/1.0.1/build/vox.min.js"></script>
    <title>スターターパック</title>
</head>
<body>
    <div id="mobileDesc"></div>
    <div id="log" class="hid">
        <div class="opener"><</div>
        <div class="main"></div>
        <div class="text"></div>
    </div>
    <div id="movlis">
        <div class="title">Move List</div>
        <div class="list"></div>
    </div>

    <div id="main">
        <div class="space" id="home">
            <div id="timer">
                <div class="zyou"></div>
                <div class="naka"></div>
                <div class="time"></div>
            </div>
            
            <div id="debug-info">
                <div class="position"></div>
                <div class="rotation"></div>
                <div class="velocity"></div>
                <div class="acceleration"></div>
                <div class="direction"></div>
                <div class="speed"></div>
                <div class="jumpPower"></div>
                <div class="fov"></div>
                <div class="isGrounded"></div>
                <div class="isOnAccelPad"></div>
            </div>
            <div id="tpSelect">
                <div class="item"><img class="img" src="assets/systems/center.png"/><span class="text">center</span></div>
                <div class="item"><img class="img" src="assets/systems/course1.png"/><span class="text">course1</span></div>
                <div class="item"><img class="img" src="assets/systems/course2.png"/><span class="text">course2</span></div>
                <div class="item"><img class="img" src="assets/systems/course3.png"/><span class="text">course3</span></div>
            </div>
            <div id="left"></div><div id="right"></div>
            <div id="upper"></div><div id="lower"></div>

        </div>

    </div>
    
    <!-- <script src="data.js" defer></script> -->
    <!-- <script src="nakami.js" defer></script> -->

    <script>
        (function() {
            let ts = new Date().getTime(); 

            let fs = ['data', 'nakami'];
            for(let f of fs){
                let script = document.createElement('script');
                script.src = `${f}.js?v=${ts}`;
                script.defer = true;
                document.head.appendChild(script);
            }

            let link = document.createElement('link');
            link.rel = "stylesheet";
            link.href = `mitame.css?v=${ts}`;
            link.onload = () => {
                document.body.style.visibility = "visible";
            };
            document.head.appendChild(link);
        })();
    </script>
</body>
</html>
